name = "vifm-floorplan-generator"
main = "worker.js"
compatibility_date = "2026-10-28"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://mediaonemultimedia.github.io"
OPENAI_MODEL = "gpt-5.4"

